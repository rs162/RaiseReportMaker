{% extends "base.html" %}
{% block title %}{{ action }} · DancePass{% endblock %}

{% block content %}
  <section class="card">
    <header class="card-head"><h2>{{ action }}</h2></header>
    <form method="post" class="form">
      <div class="row">
        <label>First name *<input name="first_name" value="{{ student.first_name or '' }}" required></label>
        <label>Last name *<input name="last_name" value="{{ student.last_name or '' }}" required></label>
      </div>
      <div class="row">
        <label>Email<input type="email" name="email" value="{{ student.email or '' }}"></label>
        <label>Phone<input name="phone" value="{{ student.phone or '' }}"></label>
      </div>
      <label>Notes<textarea name="notes" rows="3">{{ student.notes or '' }}</textarea></label>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-ghost" href="{{ url_for('students_list') }}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
